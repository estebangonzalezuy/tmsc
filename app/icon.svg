<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- A globe: the club's outlined circle, given an equator and a meridian.
       Black on white, like the rest of the site. Drawn as three strokes and
       no more, because a full wireframe of parallels turns to gray mush at
       16px. The white ground is a disc rather than the full square so the
       mark keeps a clean silhouette in dark browser chrome, where a square
       reads as a sticker; on a white tab bar the two are identical. Weights
       are tuned for 16px: the ring is heaviest, the equator and meridian a
       step lighter, so the silhouette reads first and the detail second. -->
  <circle cx="16" cy="16" r="16" fill="#ffffff" />
  <g fill="none" stroke="#0d0d0d" stroke-linecap="round">
    <circle cx="16" cy="16" r="12" stroke-width="2.6" />
    <path d="M4.6 16 H27.4" stroke-width="2" />
    <ellipse cx="16" cy="16" rx="5.6" ry="12" stroke-width="2" />
  </g>
</svg>
