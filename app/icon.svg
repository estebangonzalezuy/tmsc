<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- The club's circled letter — the lowercase t of tMSC — inverted so it
       survives 16px: an outlined ring and a hairline letter turn to mush at
       favicon size, a filled disc doesn't. Drawn as strokes rather than set
       as text, so it renders identically everywhere instead of following
       whatever serif the viewer's system happens to have. The stem carries a
       tail: a bare cross reads as a plus sign at small sizes. -->
  <circle cx="16" cy="16" r="16" fill="#0d0d0d" />
  <path
    d="M14.9 7.5 V19.4 c0 2.1 1.9 3.1 4.2 2.4"
    fill="none"
    stroke="#ffffff"
    stroke-width="2.6"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <path
    d="M10.2 12.4 H20"
    fill="none"
    stroke="#ffffff"
    stroke-width="2.6"
    stroke-linecap="square"
  />
</svg>
