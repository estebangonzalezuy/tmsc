<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- The club's circled letter, inverted so it survives 16px: an outlined
       ring and a hairline M turn to mush at favicon size, a filled disc
       doesn't. The M is drawn as a stroke rather than set as text, so it
       renders identically everywhere instead of following whatever serif
       the viewer's system happens to have. -->
  <circle cx="16" cy="16" r="16" fill="#0d0d0d" />
  <path
    d="M9 22.5 V10.5 L16 17.5 L23 10.5 V22.5"
    fill="none"
    stroke="#ffffff"
    stroke-width="2.6"
    stroke-linecap="square"
    stroke-linejoin="miter"
  />
</svg>
