name: stills

# the Stills — pulls style frames out of a video and commits them.
#
# Started by hand from the Curator (/curate on the site), which POSTs a
# workflow_dispatch straight to api.github.com with a token pasted in the
# browser. Same contract as the Desk: nothing here needs a secret on Vercel,
# and the deployed app stays configuration-free.
#
# Two passes, one workflow. Leave `times` empty and it suggests frames by
# scene detection and builds the scrub sheets. Give it `times` and it cuts
# exactly those moments — that's the Curator's scrubber writing back.
#
# Optional repository secret (Settings → Secrets and variables → Actions):
#   YTDLP_COOKIES  base64 of a cookies.txt exported from a signed-in browser.
#                  YouTube turns away datacentre addresses often enough that
#                  a busy day needs one. Without it most videos still come
#                  down; the ones that don't fail loudly.

on:
  workflow_dispatch:
    inputs:
      url:
        description: Video URL (YouTube, Vimeo, anything yt-dlp reads)
        required: true
        type: string
      times:
        description: Seconds to cut, comma separated. Empty = suggest frames.
        required: false
        type: string
        default: ""
      id:
        description: Project slug. Empty = from the video's title.
        required: false
        type: string
        default: ""
      count:
        description: How many frames to suggest
        required: false
        type: string
        default: "18"

# projects.json is a single file every run rewrites, so runs queue rather
# than race. Nothing here is fast enough for the wait to matter.
concurrency:
  group: stills
  cancel-in-progress: false

jobs:
  extract:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Said before the four minutes of apt and downloading, not after, so the
      # log leads with the thing you can act on. A warning rather than a
      # failure: the extractor still tries every player client, and one of
      # them sometimes gets through without cookies.
      - name: Say if YouTube is likely to refuse
        env:
          URL: ${{ inputs.url }}
          HAS_COOKIES: ${{ secrets.YTDLP_COOKIES != '' }}
        run: |
          case "$URL" in
            *youtube.com*|*youtu.be*)
              if [ "$HAS_COOKIES" != "true" ]; then
                echo "::warning::YouTube link and no YTDLP_COOKIES secret. YouTube usually refuses GitHub's runners without one — see docs/THE-STILLS.md. Trying anyway; a Vimeo link never needs this."
              fi ;;
          esac

      - name: Install yt-dlp and ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python3 -m pip install --quiet --upgrade yt-dlp

      # Inputs reach the shell as environment variables, never as ${{ }} inside
      # a run block: that interpolation is pasted in before bash sees it, so a
      # URL with a quote in it would be running as script.
      - name: Extract the frames
        env:
          YTDLP_COOKIES: ${{ secrets.YTDLP_COOKIES }}
          URL: ${{ inputs.url }}
          PROJECT_ID: ${{ inputs.id }}
          TIMES: ${{ inputs.times }}
          COUNT: ${{ inputs.count }}
        run: |
          args=(--url "$URL" --count "${COUNT:-18}")
          if [ -n "$PROJECT_ID" ]; then args+=(--id "$PROJECT_ID"); fi
          if [ -n "$TIMES" ]; then args+=(--times "$TIMES"); fi
          node scripts/stills/extract.mjs "${args[@]}"

      - name: Commit what it found
        env:
          URL: ${{ inputs.url }}
        run: |
          git config user.name "the Stills"
          git config user.email "stills@themotionsocialclub.invalid"
          git add public/stills content/stills
          if git diff --cached --quiet; then
            echo "Nothing new — every moment asked for was already in the project."
            exit 0
          fi
          git commit -m "Extract stills from $URL"
          # The Studio publishes to main straight from the browser and may
          # land between the checkout and the push. Rebase and retry rather
          # than fail a run that did real work.
          for attempt in 1 2 3 4; do
            if git push origin HEAD:main; then
              echo "Pushed on attempt $attempt"
              exit 0
            fi
            echo "Push rejected, rebasing (attempt $attempt)"
            git pull --rebase origin main
            sleep $((attempt * 2))
          done
          echo "Could not push after four attempts"
          exit 1
