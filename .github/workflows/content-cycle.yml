name: content cycle

# The club's posting loop. There is no schedule: every run is started by
# hand from the Desk (/desk on the site), which is the only trigger with a
# latency you can predict.
#
# The cron that used to be here asked for a run every five minutes and
# GitHub delivered 15 out of 347 over a day and a half, one to three hours
# apart — and failed loudly whenever its runner pool was unhappy, which is
# email you can do nothing about. Pressing a button beats waiting for a
# promise nobody was keeping. `repository_dispatch` stays for a Notion
# button, if that plan ever gets paid for.
#
# Needs two repository secrets (Settings → Secrets and variables → Actions):
#   ANTHROPIC_API_KEY  console.anthropic.com → API keys
#   NOTION_TOKEN       notion.so/my-integrations → internal integration,
#                      then share the tMSC databases with it

on:
  # Lets a Notion button fire a run straight from the phone — POST to
  # /repos/:owner/:repo/dispatches with {"event_type":"content-cycle",
  # "client_payload":{"job":"journal"}}. See docs/CONTENT-SYSTEM.md.
  repository_dispatch:
    types: [content-cycle]
  workflow_dispatch:
    inputs:
      job:
        description: What to run
        type: choice
        default: now
        options:
          [
            now,
            journal,
            queue,
            weekly,
            angles,
            review,
            drafts,
            visuals,
            library,
            objectives,
            all,
          ]
      dry_run:
        description: Read-only — print what it would do
        type: boolean
        default: false

concurrency:
  group: content-cycle
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: scripts/content-cycle/package-lock.json

      - run: npm ci
        working-directory: scripts/content-cycle

      - name: Run the cycle
        working-directory: scripts/content-cycle
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          SITE_ORIGIN: https://themotionsocialclub.vercel.app
        run: |
          node index.mjs ${{ inputs.job || github.event.client_payload.job || 'now' }} \
            ${{ inputs.dry_run && '--dry-run' || '' }}
