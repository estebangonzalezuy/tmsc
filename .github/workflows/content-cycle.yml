name: content cycle

# The club's posting loop, on a schedule that costs nothing when idle. The
# hourly run only reads Notion; it touches the Claude API when — and only
# when — a row is actually waiting in Chosen, Ready or Posted.
#
# The schedule is best-effort and GitHub means it: asked for every five
# minutes over a day and a half it delivered 15 runs out of 347, arriving
# one to three hours apart. Asking more often does not get you more runs,
# so this asks hourly, which is roughly what arrives anyway.
#
# Sitting down to make a post? Don't wait for it. Run workflow → `now`
# takes every Chosen row to a finished draft + Post link in about a minute.
# The button is the only path with a predictable latency.
#
# Needs two repository secrets (Settings → Secrets and variables → Actions):
#   ANTHROPIC_API_KEY  console.anthropic.com → API keys
#   NOTION_TOKEN       notion.so/my-integrations → internal integration,
#                      then share the three tMSC databases with it
#
# GitHub only runs scheduled workflows from the default branch, so this file
# has to be on `main` to fire.

on:
  schedule:
    - cron: "17 * * * *" # journal, drafts, visuals, library — when GitHub feels like it
    - cron: "0 12 * * 1" # Mondays 12:00 UTC: the above + three new angles
    - cron: "0 12 1 * *" # 1st of the month: roll the objective over
  # Lets a Notion button fire a run straight from the phone — POST to
  # /repos/:owner/:repo/dispatches with {"event_type":"content-cycle",
  # "client_payload":{"job":"journal"}}. See docs/CONTENT-SYSTEM.md.
  repository_dispatch:
    types: [content-cycle]
  workflow_dispatch:
    inputs:
      job:
        description: What to run
        type: choice
        default: now
        options:
          [now, journal, queue, weekly, angles, drafts, visuals, library, objectives, all]
      dry_run:
        description: Read-only — print what it would do
        type: boolean
        default: false

concurrency:
  group: content-cycle
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: scripts/content-cycle/package-lock.json

      - run: npm ci
        working-directory: scripts/content-cycle

      - name: Pick the job
        id: pick
        run: |
          case "${{ github.event.schedule }}" in
            "0 12 * * 1")  job=weekly ;;
            "0 12 1 * *")  job=objectives ;;
            "17 * * * *")  job=queue ;;
            *)             job="${{ inputs.job || github.event.client_payload.job || 'now' }}" ;;
          esac
          echo "job=$job" >> "$GITHUB_OUTPUT"

      - name: Run the cycle
        working-directory: scripts/content-cycle
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          SITE_ORIGIN: https://themotionsocialclub.vercel.app
        run: |
          node index.mjs ${{ steps.pick.outputs.job }} \
            ${{ inputs.dry_run && '--dry-run' || '' }}
