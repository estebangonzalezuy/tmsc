  :root { --bg:#3D3DEB; --fg:#FFFFFF; }
  html, body { margin:0; height:100%; overflow:hidden; background:var(--bg); color:var(--fg); }
  canvas#stage { position:fixed; inset:0; width:100vw; height:100vh; display:block; cursor:crosshair; }
  svg.defs { position:absolute; width:0; height:0; }
  /* Flat controls. The pad sits on the left; the other buttons are a
     separate group on the right. White fill, black text, a 1.5px black
     edge. Selected flips to black fill and white text, with a white edge
     so the shape still reads on a black canvas. No shadows.
     Archivo Narrow is embedded. Nothing here is fetched. */
  #mi, #mi-hint { font-family:"Archivo Narrow", sans-serif; font-weight:400; }
  #mi { position:fixed; z-index:5; inset:16px; width:auto; pointer-events:none; color:#000; }
  #mi[hidden] { display:none; }
  .mi-pad, .mi-card { pointer-events:auto; position:absolute; box-shadow:none; }
  .mi-pad {
    left:0; top:50%; transform:translateY(-50%);
    background:#fff; color:#000; border:1.5px solid #000; outline:none;
    border-radius:14px; padding:10px;
  }
  .mi-card {
    right:0; top:0; width:min(300px, 38vw); max-height:100%; overflow:auto;
    background:transparent; border:0; padding:4px; box-sizing:border-box;
  }
  .mi-head { display:flex; justify-content:flex-end; margin:0 0 2px; }
  .mi-body { display:flex; flex-direction:column; align-items:flex-end; gap:4px; }
  #mi.is-collapsed .mi-body, #mi.is-collapsed .mi-warn { display:none; }
  .mi-warn { margin:0 0 8px; padding:4px 10px; font-size:12px; color:#000; background:#fff; border:1.5px solid #000; outline:none; border-radius:999px; box-shadow:none; }
  #mi button, .mi-slide, .mi-toggle, .mi-text textarea, .mi-label {
    color:#000; background:#fff; border:1.5px solid #000; outline:none; border-radius:999px;
    box-shadow:none; font:inherit;
  }
  .mi-slide { position:relative; align-self:stretch; height:30px; }
  .mi-slide span, .mi-slide b { position:absolute; top:50%; transform:translateY(-50%); font-size:13px; font-weight:400; pointer-events:none; color:#000; }
  .mi-slide span { left:12px; }
  .mi-slide b { right:12px; font-weight:700; }
  .mi-slide i { position:absolute; top:7px; bottom:7px; width:1.5px; background:#000; pointer-events:none; }
  .mi-slide input { position:absolute; inset:0; width:100%; height:100%; margin:0; opacity:0; cursor:ew-resize; }
  .mi-seg, .mi-actions { display:flex; flex-wrap:wrap; justify-content:flex-end; gap:4px; }
  .mi-seg button, .mi-actions button, #mi-play, .mi-text button, #mi-fold {
    font-size:13px; padding:3px 9px; cursor:pointer;
  }
  #mi button.is-on, #mi .mi-toggle[aria-pressed="true"] {
    background:#000; color:#fff; border-color:#fff;
  }
  #mi-presets button { width:36px; padding:5px 0; }
  #mi #mi-fold { width:32px; height:32px; padding:0; border-radius:50%; cursor:grab; }
  .mi-toggle { display:flex; align-items:center; justify-content:space-between; gap:16px; height:30px; padding:0 12px; font-size:13px; cursor:pointer; }
  .mi-toggle s { display:inline-block; width:32px; height:18px; border:1.5px solid #000; border-radius:9px; position:relative; background:#fff; text-decoration:none; box-shadow:none; outline:none; }
  .mi-toggle s::after { content:""; position:absolute; top:1px; left:1px; width:12px; height:12px; border-radius:50%; background:#000; }
  .mi-toggle[aria-pressed="true"] s { background:#000; border-color:#fff; }
  .mi-toggle[aria-pressed="true"] s::after { left:auto; right:1px; background:#fff; }
  .mi-label { align-self:flex-end; font-size:11px; letter-spacing:.04em; text-transform:uppercase; padding:3px 8px; margin:0; }
  .mi-grid { display:grid; grid-template-columns:repeat(8, minmax(0, 1fr)); gap:5px; width:min(272px, 30vw); }
  #mi .mi-pad .mi-grid button {
    width:100%; aspect-ratio:1; height:auto; padding:0; border-radius:5px;
    box-shadow:none; outline:none; background:#fff; color:#000; border:1.5px solid #000;
  }
  #mi .mi-grid button.is-on { background:#000; color:#fff; border-color:#fff; }
  #mi .mi-grid button.is-step { border-bottom-width:3px; }
  #mi .mi-grid button.is-on.is-step { border-bottom-color:#fff; }
  .mi-text { display:flex; flex-direction:column; align-items:flex-end; gap:4px; align-self:stretch; }
  .mi-text textarea { font:inherit; font-size:14px; width:100%; min-height:52px; padding:8px 10px; border-radius:16px; resize:vertical; box-sizing:border-box; }
  .mi-actions { align-self:stretch; }
  .mi-actions button { flex:1; }
  #mi-hint {
    position:fixed; z-index:6; left:0; right:0; bottom:20px; margin:0; padding:0 336px;
    display:flex; justify-content:center; background:transparent; border:0; box-shadow:none;
    pointer-events:none;
  }
  #mi-hint span {
    max-width:100%; text-align:center; font-size:15px; line-height:1.3; color:#000; background:#fff;
    border:1.5px solid #000; border-radius:999px; padding:8px 16px; box-shadow:none;
  }
  #mi-hint[hidden] { display:none; }
  @media (max-width: 980px) {
    .mi-pad { top:8px; transform:none; }
    .mi-grid { width:min(200px, 46vw); }
    .mi-card { top:auto; bottom:0; left:0; right:0; width:auto; max-height:42vh; }
    #mi-hint { padding:0 16px; bottom:calc(42vh + 28px); }
  }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<!-- tMSC pixel level 2 "bleed": gaussian σ = .375·cell, hard threshold .43, painted in the type colour -->
<svg class="defs" aria-hidden="true"><filter id="pxbleed" color-interpolation-filters="sRGB" x="-5%" y="-5%" width="110%" height="110%">
  <feGaussianBlur in="SourceAlpha" stdDeviation="2.25" result="b"/>
  <feComponentTransfer in="b" result="t"><feFuncA type="linear" slope="1000" intercept="-430"/></feComponentTransfer>
  <feFlood id="pxflood" flood-color="#FFFFFF" result="f"/>
  <feComposite in="f" in2="t" operator="in"/>
</filter></svg>
<aside id="mi" aria-label="Motion Instrument">
  <div class="mi-pad" id="mi-pad">
    <div class="mi-grid" id="mi-grid" role="group" aria-label="Pad"></div>
  </div>
  <div class="mi-card">
    <header class="mi-head" id="mi-head">
      <button type="button" id="mi-fold" aria-label="Collapse">–</button>
    </header>
    <p class="mi-warn" id="mi-warn" hidden>Font not loaded</p>
    <div class="mi-body">
      <button type="button" id="mi-play">Play</button>
      <div class="mi-slide"><span>BPM</span><i id="mi-bpm-h"></i><b id="mi-bpm-v">120</b><input id="mi-bpm" type="range" min="40" max="240" step="1" value="120" aria-label="BPM"></div>
      <div class="mi-seg" id="mi-sub" role="group" aria-label="Subdivision"></div>
      <div class="mi-seg" id="mi-presets" role="group" aria-label="Preset"></div>
      <div class="mi-seg" id="mi-sound" role="group" aria-label="Sound"></div>
      <div class="mi-seg" id="mi-tone" role="group" aria-label="Tone"></div>
      <div class="mi-seg" id="mi-scale" role="group" aria-label="Scale"></div>
      <div class="mi-slide"><span>Variety</span><i id="mi-var-h"></i><b id="mi-var-v">50</b><input id="mi-var" type="range" min="0" max="100" step="25" value="50" aria-label="Variety"></div>
      <button type="button" class="mi-toggle" id="mi-ramp" aria-pressed="false"><span>Ramp</span><s></s></button>
      <button type="button" class="mi-toggle" id="mi-pixel" aria-pressed="true"><span>Pixel</span><s></s></button>
      <div class="mi-seg" id="mi-theme" role="group" aria-label="Theme"></div>
      <label class="mi-text"><span class="mi-label">Text</span>
        <textarea id="mi-text" rows="3" spellcheck="false" autocomplete="off" aria-label="Text"></textarea>
        <button type="button" id="mi-reset">Reset</button>
      </label>
      <div class="mi-actions">
        <button type="button" id="mi-clear">Clear</button>
        <button type="button" id="mi-rec">Record</button>
      </div>
    </div>
  </div>
</aside>
<p id="mi-hint"><span>Click the pad or press Space to start — drag on the pad to shape the sound.</span></p>
<script>
(() => {
// ===================== DIRECTION D · ETIQUETAS (round 3: dense packed tags) =====================
// Every note drops the next word of a short paragraph as a tag (box + Archivo Narrow 700). Tags spring into a packed shape:
// edge-to-edge, zero spacing (2 px overlap so tilts never open a seam). Refs: ref-1 (dense pile of word tags with spring
// physics), ref-2 (FP: hard grid splits, flat colour blocks, bitmap display type), Cosmos pin (strict grid, one change at a
// time, letter-spacing as the motion). One cycle = 8 s; when the next cycle's first tag lands the pile falls away → seamless.
// All motion is closed-form from note onsets → stateless and deterministic. Per-tag character (mass / stiffness / damping /
// delay / tilt) is seeded by (preset, slot) and scaled by VARIETY (V).
const DIR = { name:'D · ETIQUETAS', slug:'d-etiquetas', defaultTheme:0, bpm:120, window:9.6, maxItems:200,
  // lb/lt = tag box / tag text for single-ink presets; fg = UI and display type
  themes:[ { name:'white',  bg:'#FFFFFF', fg:'#000000', lb:'#000000', lt:'#FFFFFF' },
           { name:'black',  bg:'#000000', fg:'#FFFFFF', lb:'#FFFFFF', lt:'#000000' },
           { name:'yellow', bg:'#F4C500', fg:'#000000', lb:'#000000', lt:'#FFFFFF' },
           { name:'green',  bg:'#2E7D46', fg:'#FFFFFF', lb:'#000000', lt:'#FFFFFF' },
           { name:'orange', bg:'#EE4B2B', fg:'#000000', lb:'#000000', lt:'#FFFFFF' } ],
  feel:{ major:{ dur:.3, life:1e6, exit:1.0, keep:1e6, ease:'heavy', gravity:0 },
         minor:{ dur:.5, life:1e6, exit:1.0, keep:1e6, ease:'heavy', gravity:0 } },
};
const DEFAULT_TEXT = 'Press a key and a word moves. The human plays the tool, the tool plays back. Every note drops a label, every label finds ' +
  'its place. Type becomes rhythm, rhythm becomes layout. Springs, weight, timing, a little chaos. One key, one word, one move. ' +
  'Play it loud, play it slow, play it again. Motion Social Club Barcelona.';
let TEXT = DEFAULT_TEXT.split(' ');
const SIGN = 4;                                         // every cycle ends on the sign-off "Motion Social Club Barcelona."
let textRev = 0;
function wordAt(slot, cap) {

// ---------------- deterministic render API (hero loop): stateless replay of a scripted pattern ----------------

(function mountPanel() {
